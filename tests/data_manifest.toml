# Public test data that is too large to commit. tools/fetch_test_data.py downloads each file into the folder named
# by FF_TEST_DATA, checks its size and SHA-256, and unpacks archives. Nothing here is ever committed.
# Mirrors are tried in order. The licence applies to the data; the credit line is what a copy must keep.

[[file]]
name = "librispeech-test-clean"
urls = [
    "https://openslr.trmal.net/resources/12/test-clean.tar.gz",
    "https://openslr.elda.org/resources/12/test-clean.tar.gz",
]
size = 346663984
sha256 = "39fde525e59672dc6d1551919b1478f724438a95aa55f874b576be21967e6c23"
licence = "CC-BY-4.0"
credit = "LibriSpeech ASR corpus, V. Panayotov, G. Chen, D. Povey and S. Khudanpur, 2015 (OpenSLR 12)"
save_as = "librispeech/test-clean.tar.gz"
unpack_to = "librispeech"

