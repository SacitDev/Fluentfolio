# Pre-registration: which speech model gives the most faithful transcript of a learner's speech.
# Committed before any model runs on a test split. After the freeze no value, rule or threshold below
# changes; a model that loses is a result. Thresholds that are "set on dev" are fitted on the dev splits
# only, then frozen before the test splits run. All hashes are SHA-256 in lower-case hex.

name = "asr_bakeoff"
question = """
Should the default speech model stay Parakeet TDT 0.6B v2 or should v3 be proposed instead, does Canary 1B v2
earn a place next to Whisper, which transcript style does each model get, do the voiced-gap markers go into
the text for the AI chat, and what confidence threshold does each model use for unsure words?"""
seed = 20261013
max_run_hours = 8

