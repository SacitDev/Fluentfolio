[data.librispeech]
what = "LibriSpeech test-clean, read speech; harness check only"
source = "https://openslr.trmal.net/resources/12/test-clean.tar.gz"
sha256 = "39fde525e59672dc6d1551919b1478f724438a95aa55f874b576be21967e6c23"
licence = "CC BY 4.0"
selection = "utterances in order of sha256('20261013:' + utterance ID), taken until 600 s"
target_s = 600

[data.composed]
what = "sessions composed from public clips with exact truth: set B, CS-HES and non-speech clips"
# Set B: the six committed recipes with seed + 1000 and no voice of set A. Each synthetic voice is replaced
# by another Kokoro-82M voice (revision f3ff3571) of the same sex and accent (the map below), and each of its
# lines is synthesised again from the same text. The LibriSpeech candidate is replaced by the test-clean
# speaker of the same sex who appears in no committed recipe, the first in order of
# sha256("20261013:" + recipe name + ":" + speaker ID); each clip by that speaker's unused utterance closest
# in duration (ties by utterance ID). Built locally, never committed. Each clip is prepared as set A's
# were (eval/sets.py), except that silence frames up to -37 dBFS are cut, not only those under -55 dBFS:
# the new speakers' noise floors reach about -50 dBFS. An utterance the builder still refuses is passed
# over for the next one in that order.
set_b = "six recipes, seed + 1000, every voice replaced: Kokoro voices by the map, LibriSpeech by hash"
set_b_voices = { bf_emma = "bf_isabella", bm_george = "bm_lewis", af_bella = "af_nicole" }
hesitations = "CS-HES, derived from CS-SOLO with fillers and repeated lead words at known times"
# Non-speech: 120 s each, made locally: digital silence with a noise floor 60 dB under full scale, pink noise
# at 30 dB under full scale, and the synthetic music bed (held chords and a sung line) at 20 dB under full
# scale.
non_speech = ["silence", "pink_noise", "music"]
non_speech_s = 120

# ---------------------------------------------------------------------------------------------------------
[normaliser]
# One normaliser for every model and set, in eval/ only: lower case; digits spelled as words; "%" as
# "percent"; the backchannels below written as one word, so they never count as fillers; hyphens and
# slashes as spaces; punctuation removed except an apostrophe inside a word; tags in brackets ([laughter],
# <noise>) removed, except the filler tags below; runs of spaces collapsed. Repair retention reads the
# cut-off marks (*) from the reference before this normaliser removes them.
fillers = ["uh", "um", "er", "erm", "ah", "eh", "hmm", "mm"]
filler_tags = ["[uh]", "[um]"]
backchannels = ["uh-huh", "huh-uh", "mm-hmm"]

[metrics]
wer = "word error rate after the normaliser, with jiwer; per item, then pooled over the set (errors / words)"
content_wer = "the same with every filler removed from both sides"
fillers = """
position-matched filler precision, recall and F1: every filler form and filler tag becomes one FILLER
token; the reference and the output are aligned word by word (jiwer's alignment); an output FILLER aligned
to a reference FILLER is a true positive, any other output FILLER a false positive, any other reference
FILLER a false negative"""
grammar_edits = """
grammar-edit rate per 100 reference words: aligned substitutions where both words belong to the same group
of be (am is are was were be been being), have (have has had having), do (do does did doing done),
articles (a an the) or pronouns (i me my mine you your yours he him his she her hers it its we us our ours
they them their theirs), or where the longer word is the shorter one (of 2 letters or more) plus one of the
endings s, es, ed or ing, or plus d after a final e; a final e is dropped before ing"""
grammar_endings = ["s", "es", "ed", "ing"]
repair_retention = """
on Nyra: the share of the reference's repeated words (a word written twice in a row) and cut-off words
(ending in *) whose aligned output word keeps them: the repeated word appears twice, or the output has a
word that starts with the cut-off's letters"""
insertions = "words written per minute of the non-speech clips"
timestamps = "share of words with a start and end inside their chunk, and starts that never go backwards"
clip_edge_error = """
composed sessions: for each truth clip whose first and last reference words were both recognised, the
absolute difference in ms between the first word's start and the clip's start, and between the last
word's end and the clip's end; the median over all edges"""
real_time_factor = "processing wall time / audio duration, on the GPU and on the CPU (CPU on a 20-min subset)"
cpu_subset = "Nyra test clips in order of sha256('20261013:' + clip ID), taken until 1,200 s"
cpu_subset_s = 1200
peak_ram = "the largest resident memory of the whole process tree, sampled every 0.5 s"
canary_loop_guard = "the number of segments Canary's loop guard dropped"
# The guard drops a whole segment with more tokens a second than this, or with a run of `run` words said
# `repeats` times or more (the product's values, tied to it by a test).
canary_loop_guard_values = { tokens_per_s = 8.0, run = 4, repeats = 3 }
# The voiced-gap values below in numbers, tied to the product's by a test.
voiced_gap_values = { gap_ms = 200, speech_ms = 200, other_speaker_ms = 300 }
voiced_gap = """
a voiced gap is a stretch of 200 ms or more between two words of one utterance in which the voice
detector marks 200 ms or more of speech, not within 300 ms of another speaker's speech. Precision on the
composed sessions: a gap is correct when it overlaps a truth filler, repeated word or cut-off the model did
not write. Precision on Nyra: a gap is correct when the aligned reference between its two words holds a
filler tag, a cut-off, a sound tag or a repeated word that the output lacks"""
confidence = """
for each model that gives a confidence: a word is unsure when its confidence is under the threshold; the
target is the output words that the alignment marks as substituted or inserted"""

[metrics.grammar_groups]
# The closed groups of the grammar-edit counter, as listed in the grammar_edits text above.
be = ["am", "is", "are", "was", "were", "be", "been", "being"]
have = ["have", "has", "had", "having"]
do = ["do", "does", "did", "doing", "done"]
article = ["a", "an", "the"]
pronoun = ["i", "me", "my", "mine", "you", "your", "yours", "he", "him", "his", "she", "her", "hers", "it",
           "its", "we", "us", "our", "ours", "they", "them", "their", "theirs"]

# ---------------------------------------------------------------------------------------------------------
[counter_check]
# Before any decision uses it, a reviewer with IELTS expertise judges 20 aligned pairs that the grammar-edit
# counter flags on EdAcc dev output. Below 0.8 precision the metric is reported as "not reliable" and drops
# out of every rule that names it.
pairs = 20
min_precision = 0.8
model = "whisper-large-v3-turbo"  # the candidate most likely to smooth a speaker's grammar
order = "the flagged substitutions in order of sha256('20261013:<row ID>:<reference word index>'), first 20"
# The check's result, recorded before the freeze; every rule that names the grammar-edit rate follows it.
reliable = false
result = """
Not reliable. The counter flagged exactly 20 substitutions in 3,347 reference words of the first dev
selection, and the reviewer judged 15 of them real grammar edits: precision 0.75. Four false flags were one
pronoun heard as another (a misheard word, not an edit) and one was borderline. Once the row left out of
scoring was removed, 3,342 words gave 20 flags again: 19 of the same, of which 14 were judged real, and one
new, judged real too: precision 0.75 (15 of 20) again. Both counts take the borderline flag as false; taken
as real, precision would be exactly 0.80, so the counter stands on the bar at best."""

[calibration]
# The harness is checked first. Outside a range, no decision is taken until the cause is found.
parakeet_v2_librispeech_wer_pct = [1.0, 3.5]
canary_nyra_test_filler_f1_pct = [16.7, 36.7]  # the published 26.7 plus or minus 10 points
# The Canary filler F1 here is the Nyra benchmark's own scoring at a pinned commit, as the published figure
# is; if that scorer cannot be used, the position-matched F1 above is used and the report says so.

[statistics]
method = "paired bootstrap of the difference between two models"
resamples = 2000
seed = 20261013
interval = "95 % percentile interval"
units = { edacc = "speaker", nyra = "clip" }
better = "the interval excludes 0 and the margin in the rule is met"

# ---------------------------------------------------------------------------------------------------------
[decisions.default_model]
rule = """
Propose Parakeet v3 as the default only if its filler F1 on the Nyra test split is at least 5 points
higher than v2's (interval excludes 0) and its WER on the EdAcc test selection is no more than 1 point
higher than v2's. Otherwise v2 stays the default. A proposal is a recommendation to the maintainer, not
a change."""
filler_f1_margin_points = 5.0
wer_margin_points = 1.0

[decisions.canary]
rule = """
Canary is added next to Whisper only if every condition holds: a lower grammar-edit rate than Whisper on
the EdAcc test selection (interval excludes 0); filler F1 on the Nyra test split at least Whisper's; WER on
the EdAcc test selection no more than Whisper's + 2 points; median clip-edge error on composed set B no more
than Parakeet v2's + 40 ms; a CPU real-time factor of 1.0 or less with alignment time included; peak RAM
6.5 GB or less. Canary never replaces Whisper. When the counter check finds the grammar-edit rate not
reliable, the first condition drops out and every other one still holds."""
wer_margin_points = 2.0
edge_margin_ms = 40
cpu_rtf_max = 1.0
peak_ram_gb_max = 6.5

[decisions.transcript_style]
rule = """
A model's style is verbatim-best-effort only when its grammar-edit rate on the EdAcc test selection is no
more than Parakeet v2's + 1 per 100 words; otherwise smoothed. Whisper is always smoothed. When the counter
check finds the grammar-edit rate not reliable, no model is judged by it and the conservative default
applies: verbatim-best-effort for both Parakeet models, smoothed for Whisper and for Canary."""
margin_per_100_words = 1.0

[decisions.voiced_gaps]
rule = """
Voiced-gap markers go into the text for the AI chat only if their precision is 0.7 or more on the composed
sessions and 0.7 or more on Nyra test; otherwise they stay in the details folder."""
min_precision = 0.7

[decisions.confidence]
rule = """
Per model, on EdAcc dev and Nyra dev together: the threshold from 0.05 to 0.95 in steps of 0.05 with the
highest F1 for finding substituted or inserted words; ties to the lower threshold. If the best F1 is under
0.2, the model gets no threshold and the evidence says so. Fixed before the test splits run."""
grid = [0.05, 0.95, 0.05]
min_f1 = 0.2

[decisions.parakeet_cpu]
rule = """
If Parakeet v2 on this machine's CPU takes more than 3 minutes for the 15-minute composed session, the
report says so with the measured time and proposes GPU support for it; the product does not change."""
max_cpu_s_for_15_min = 180

[report]
lines = ["prereg_sha256: <sha256 of this file at the freeze commit>", "Decision: <one line per decision>"]
content = "every model, every set and every metric, including the ones that lose, with per-item outputs"
