role = "shipped next to Whisper only if it meets every Canary rule below"
# Word times come from the runtime as shipped; if it gives none, from the product's CTC alignment pass,
# whose time is counted in Canary's real-time factor.
word_times = "runtime, else the CTC alignment pass"

# Every model runs through the product's own speech step code (VAD chunks, word output, guards), int8 ONNX
# or CTranslate2 as shipped, on the GPU where the product allows it and on the CPU for the CPU timings.

# ---------------------------------------------------------------------------------------------------------
[data.edacc]
what = "EdAcc, English conversations over video calls between speakers with many accents"
source = "https://huggingface.co/datasets/edinburghcstr/edacc"
revision = "d9ae7bd344f0562b766ec93ee5ce8f2f9568ce66"
licence = "CC BY-SA 4.0 (the dataset card says: Public Domain, Creative Commons Attribution-ShareAlike)"
dev_split = "validation"
test_split = "test"
# Shards: per split, the shard files in order of sha256("20261013:" + file name); each one is taken when it
# keeps that split's total at or under 1.5 GB (10^9 bytes), otherwise passed over. This gives the lists below.
shard_rule = "sha256 order of '20261013:<file name>', first fit under 1.5 GB per split"
# Items: an item is one row, with the ID "<shard file name>:<row number>". A row is eligible when its
# speaker's l1 is given (not empty) and does not contain "english" (case-insensitive), it lasts 1-30 s, its
# reference is not the dataset's placeholder for a stretch left out of scoring, and its normalised
# reference has 3 words or more. Speakers are taken in order of sha256("20261013:" + speaker); from each,
# rows in order of sha256("20261013:" + item ID), each one taken when it keeps the speaker's total at or
# under 180 s. A next speaker is added only while the split's total is under 1,800 s. Only the metadata
# columns and the reference's word count are read to apply this rule.
selection = "l1 given, no 'english'; rows of 1-30 s with 3+ words; speakers by hash, 180 s each, to 1800 s"
l1_exclude = "english"
row_min_s = 1
row_max_s = 30
min_words = 3
not_scored = "IGNORE_TIME_SEGMENT_IN_SCORING"  # the whole reference text of a row left out of scoring
speaker_cap_s = 180
split_target_s = 1800

