repo = "istupakov/parakeet-tdt-0.6b-v2-onnx"
revision = "0bbb45a3365852604aef28b538a8f066f4ccaa85"
role = "the default; stays the default whatever the result, unless the maintainer accepts a proposed switch"

[[candidates]]
